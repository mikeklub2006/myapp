name: lab24 CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'lab24/**'
      - '.github/workflows/lab24-ci.yml'
  pull_request:
    paths:
      - 'lab24/**'

defaults:
  run:
    working-directory: lab24/task5

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lab24-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lab24/task5/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests + coverage
        # порог покрытия задан в jest.config.js, при меньшем покрытии шаг упадет
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lab24/task5/coverage/lcov-report

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
      - name: Login to registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push to registry
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy-staging:
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        # настоящего staging-сервера нет, поэтому деплой имитируется
        run: |
          echo "Деплой образа ${IMAGE}:${{ github.sha }} на staging"
          echo "docker pull ${IMAGE}:${{ github.sha }} && docker compose up -d"
          echo "Готово"
