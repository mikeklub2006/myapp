# запуск из папки lab24/task5: docker compose -f docker/docker-compose.yml up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: bbmo_401
      JWT_SECRET: ${JWT_SECRET:-change-me-access-secret-401}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-401}
      CORS_ORIGINS: http://localhost:3000
      SEED_ON_START: "true"
      LOG_LEVEL: info
    volumes:
      - uploads:/app/uploads

volumes:
  mongo-data:
  uploads:
